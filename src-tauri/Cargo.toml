[package]
name = "proagi-assistant"
version = "0.1.0"
description = "ProAGI Assistant native shell"
authors = ["ProAGI"]
license = ""
repository = ""
edition = "2021"
rust-version = "1.77.2"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
name = "app_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.6.3", features = [] }

[dependencies]
serde_json = "1.0"
serde = { version = "1.0", features = ["derive"] }
log = "0.4"
sha2 = "0.10"
tauri = { version = "2.11.5", features = [] }
tauri-plugin-log = "2"
uiautomation = { version = "0.25.1", default-features = false, features = ["input", "control"] }
windows = { version = "0.62.2", features = ["Win32_Foundation", "Win32_System_Threading"] }
